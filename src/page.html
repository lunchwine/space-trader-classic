<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#244a00"><title>Space Trader Classic</title><style>/*STYLE*/</style></head>
<body><main class="app">
<header class="command-bar"><button id="screen-title" class="screen-title" data-menu-open aria-haspopup="menu">Space Trader</button><nav id="game-tabs" class="tabs" aria-label="Shortcuts"></nav><button id="encounter-help" class="info-button" data-context-help aria-label="Help for current screen">i</button><div id="menu-bar" class="menu-bar" hidden></div></header><details id="command-menu" hidden><summary>Command</summary><nav aria-label="Command"><button data-tab="info">System information</button><button data-tab="buy">Buy cargo</button><button data-tab="sell">Sell cargo</button><button data-tab="yard">Shipyard</button><button data-tab="equipment" data-equipment-mode="buy">Buy Equipment</button><button data-tab="equipment" data-equipment-mode="sell">Sell Equipment</button><button data-tab="crew">Crew</button><button data-tab="bank">Bank</button><button data-tab="ship">Ship</button><button data-tab="status">Commander status</button><button data-tab="quests">Quests</button><button data-tab="chart" data-map-mode="galaxy">Galactic Chart</button><button data-tab="chart" data-map-mode="local">Short Range Chart</button><button data-tab="log">Journal</button></nav></details><details id="game-menu" hidden><summary>Game</summary><div class="game-menu-body"><div class="release-note">Space Trader <span id="release-version">v/*APPVERSION*/</span> · <span id="save-summary">Saved locally</span></div><div class="toolbar"><label for="commander-name">Commander <input id="commander-name" maxlength="30" value="Commander"></label><label for="difficulty">Difficulty <select id="difficulty" aria-label="Difficulty for next new game"><option value="0">Beginner</option><option value="1">Easy</option><option value="2" selected>Normal</option><option value="3">Hard</option><option value="4">Impossible</option></select></label><label for="galaxy-seed">Galaxy seed <input id="galaxy-seed" type="text" inputmode="numeric" placeholder="Random" aria-label="Galaxy seed for next new game"></label><label><input id="random-quests" type="checkbox"> Random quest destinations</label><button id="new-game">New game</button><button id="export-save">Export save</button><button id="import-save">Import save</button><button data-retire>Retire</button><button data-high-scores>High scores</button><button data-options>Options</button><button data-route-tools>Route tools</button><button data-about>About / help</button><input id="save-file" type="file" accept=".json,application/json" aria-label="Import saved game"></div></div></details>
<div class="dock-line"><span id="journey-status"></span><span id="build-version" aria-label="Game build">v20</span><span id="day"></span></div>
<div class="stats"><span>Cash <strong id="credits"></strong></span><span>Bays <strong id="cargo"></strong></span><span>Fuel <strong id="fuel"></strong></span></div><div id="world-status" hidden></div><div id="save-status" class="live-status" aria-live="polite"></div><div id="mission-status" class="mission-status" aria-live="polite"></div><div id="message"></div><div id="screen"></div>
</main><script>/*DATA*/</script><script>/*PRESENTATIONDATA*/</script><script>/*GENERATORS*/</script><script>/*ENCOUNTERS*/</script><script>/*YARD*/</script><script>/*CAMPAIGNS*/</script><script>/*FINISHING*/</script><script>/*ENGINE*/</script><script>/*ASSETS*/</script><script>/*UI*/</script></body></html>
