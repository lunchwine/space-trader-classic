plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.lunchwine.spacetraderclassic'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'io.github.lunchwine.spacetraderclassic'
        minSdk 24
        targetSdk 35
        versionCode 904
        versionName '0.9.4'
    }

    // The release is built unsigned (what F-Droid builds); android/sign-release.sh signs it afterwards.
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // F-Droid reproducible builds: no dependency metadata blob in the APK.
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    sourceSets {
        main.assets.srcDir layout.buildDirectory.dir('generated/web')
    }
}

// The game is the single-file ../index.html. Gradle rebuilds it (scripts/build.py, Python 3) so a release never ships a stale copy.
tasks.register('buildWeb', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine 'python3', 'scripts/build.py'
}
tasks.register('copyWeb', Copy) {
    dependsOn 'buildWeb'
    from(rootProject.file('../index.html'))
    into(layout.buildDirectory.dir('generated/web'))
}
preBuild.dependsOn 'copyWeb'
