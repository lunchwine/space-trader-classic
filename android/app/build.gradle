plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.carmenity.spacetraderport'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'io.github.carmenity.spacetraderport'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.3.5-port.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    // F-Droid reproducible builds: no dependency metadata blob in the APK.
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    sourceSets {
        main.assets.srcDir layout.buildDirectory.dir('generated/web')
    }
}

// The game is the single-file ../index.html (built by `python3 scripts/build.py`).
tasks.register('copyWeb', Copy) {
    from(rootProject.file('../index.html'))
    into(layout.buildDirectory.dir('generated/web'))
}
preBuild.dependsOn 'copyWeb'
